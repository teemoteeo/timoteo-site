<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Four years of modeling work (2021–2026) on one zoomable map: jobs, castings that went nowhere, Paris, and who holds the data behind each event.">
  <title>Modeling map 2021–2026 — Timoteo Costantini Scala</title>
  <script>document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';</script>
  <link rel="stylesheet" href="story.css">
</head>
<body>
  <header class="bar top">
    <h1><a href="../index.html" style="color:inherit;text-decoration:none" aria-label="Torna al sito">←</a> Timoteo Scala <span>2021–2026</span></h1>
    <button id="info-btn" class="round" aria-controls="info" aria-label="Come leggere la mappa">i</button>
  </header>

  <main id="map">
    <svg id="map-svg" role="img">
      <g id="view"><g id="world"></g></g>
    </svg>
    <div id="years" aria-hidden="true"></div>
    <div id="lane-names" aria-hidden="true"></div>
    <div id="stage" hidden>
      <video id="stage-video" playsinline controls></video>
      <img id="stage-img" alt="" draggable="false">
      <button id="stage-prev" class="round" aria-label="Foto precedente">‹</button>
      <button id="stage-next" class="round" aria-label="Foto successiva">›</button>
      <p id="stage-count" aria-live="polite"></p>
    </div>
  </main>

  <footer class="bar bottom">
    <svg id="mini" aria-label="Minimappa: clicca per spostarti"></svg>
    <button id="zoom-in" class="round" aria-label="Avvicina">+</button>
    <button id="zoom-out" class="round" aria-label="Allontana">−</button>
    <button id="zoom-fit" aria-label="Vista intera">Tutto</button>
    <button id="theme"></button>
  </footer>

  <aside id="info" hidden>
    <p class="nums"><b id="n-jobs"></b> lavori · <b id="n-nos"></b> no · <b id="n-ratio"></b> no per lavoro</p>
    <ul>
      <li><span class="ramp"><i></i><i></i><i></i><i></i><i></i></span> lavori, dal meno al più importante</li>
      <li><span class="key opt"></span> opzioni e casting non diventati lavoro</li>
      <li><span class="key hollow"></span> da verificare o esito non noto</li>
      <li><span class="key dots"></span> solo il mese è noto</li>
    </ul>
    <p>Più è grande, più conta. Avvicinati per leggere date, città e dove sta il dato.</p>
  </aside>

  <script src="vendor/d3.v7.min.js"></script>
  <script type="module" src="js/story.js"></script>
</body>
</html>
